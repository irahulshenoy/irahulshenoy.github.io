headline: Human factors, UW–Madison
description: PhD student in Industrial and Systems Engineering at UW–Madison,
  working on Bidirectional Alignment between Humans and AI, Nudging/Boosting,
  Co-adaptation,  and Driver Safety.
role: PhD student · Industrial & Systems Engineering · UW–Madison
tagline: I study alignment between Humans and AI, in both directions.
research_title: Four territories, one question.
research_intro: A chart of what I work on, drawn outward from campus.
research:
  - title: Alignment
    stage: Thesis
    both_ways: true
    focus: preference alignment, preference change, personalization
    approach: behavioral experiments, mixed methods
  - title: Driver safety
    stage: Ongoing
    both_ways: false
    focus: risk, feedback, driver behavior
    approach: telematics, video analytics, field studies
  - title: Co-adaptation
    stage: Early stage
    both_ways: true
    focus: human–AI adaptation, sense of agency, transparency
    approach: controlled experiments, prototyping
  - title: Behavior change
    stage: Funded project
    both_ways: false
    focus: nudges and boosts, autonomy, long-term effects
    approach: field interventions, behavioral analytics
question_start: "Across all four runs one question:"
question_highlight: how do people and AI come to align, in both directions,
question_end: and how can design steer that toward what people would choose for themselves?
bio: "I am a PhD student in human factors at the University of
  Wisconsin–Madison. My thesis treats alignment as a two-way street: systems
  learning what people prefer, and people’s preferences shifting as they work
  with those systems. I study it mostly in driving."
bio_note: "Away from research: maps, history and sports. Hence the globe."
